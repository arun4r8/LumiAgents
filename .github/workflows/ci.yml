name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (runtime + shared)
        run: pnpm typecheck

      - name: Typecheck (dashboard)
        working-directory: dashboard
        run: pnpm exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (runtime + shared)
        run: pnpm lint

      # The root config ignores dashboard/ (it has its own flat config), so for as
      # long as this job ran only `pnpm lint` the entire frontend was unlinted --
      # which is how 267 em dashes and nine react-hooks errors accumulated unseen.
      # Mirrors the two-step split the Typecheck job already uses.
      # --max-warnings 0 because the dashboard is at a clean zero as of this commit.
      # Warnings that cannot fail anything are warnings nobody fixes, which is how the
      # nine react-hooks errors survived. Drop the flag if it proves too strict.
      - name: Lint (dashboard)
        working-directory: dashboard
        run: pnpm exec eslint . --max-warnings 0

  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck cannot see a client component importing from a module that contains a
      # "use server" action -- the types are fine either way. Only the bundler catches
      # it, and without this job the first sign was a failed PRODUCTION deploy: CI green,
      # merge, promote, Turbopack error. A build here is ~1 minute and moves that
      # discovery to the pull request.
      #
      # The NEXT_PUBLIC_* values are needed because the build prerenders /login, which
      # constructs a Supabase client at build time.
      - name: Build dashboard
        working-directory: dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}
        run: pnpm exec next build

  stale-references:
    name: Stale References
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # The dashboard talks to PostgREST with string column lists, which TypeScript
      # cannot check. A renamed or invented column fails at RUNTIME as a 400 and the
      # panel renders empty -- invisible in review, and often invisible in the product
      # too (knowledge/page.tsx selected runs.completed_at for months; the orchestration
      # it lists has never run, so the panel would have been empty either way).
      #
      # Validates against supabase/prod-columns.json, a committed manifest of the real
      # production schema, so this needs no credentials.
      - name: Check dashboard column references
        run: python3 scripts/check-dashboard-columns.py

      # Prose cannot be checked; the things prose NAMES can be. docs/architecture.md sat
      # a month past being wrong about the agent model, and several docs pointed at
      # components/overview-realtime.tsx after it was deleted. This asserts that every
      # file path and orchestration a doc names still exists, and that the architecture
      # diagram lists every registered orchestration.
      - name: Check documentation facts
        run: python3 scripts/check-doc-facts.py

      # A Worker cannot fetch another Worker on the same zone (Cloudflare 1042), and
      # local dev never shows it because there the caller is Node. That gap hid every
      # broken server-side runtime call in production -- including responding to an
      # approval -- until a log tail turned up the error code.
      - name: Check server-side runtime calls use the Service Binding
        run: python3 scripts/check-runtime-fetch.py

      # An Anthropic client built without a timeout can hold a step for ~30 minutes and
      # then be retried by the Workflow on top. A silent hang is worse than a failure:
      # nothing alerts and the UI still says "running".
      - name: Check Anthropic clients are bounded
        run: python3 scripts/check-anthropic-client.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: runtime
        # `pnpm test --run` failed: pnpm parses `--run` as its own (unknown) flag.
        # Run vitest directly. Exclude tests/e2e; those hit the live deployment and
        # need secrets; they run post-deploy in the Deploy Worker workflow's E2E job.
        # passWithNoTests keeps this green until unit tests are added.
        run: pnpm exec vitest run --passWithNoTests --exclude "**/tests/e2e/**"
