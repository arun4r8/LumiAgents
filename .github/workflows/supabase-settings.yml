# ============================================================================
# Assert the Supabase project settings that db push cannot create (issue #140)
#
# Six project settings materially affect security and correctness, are invisible
# to this repository, are never created by `supabase db push`, and each fails in
# a way that reads as a data or code bug rather than a settings bug:
# open signup, site_url, uri_allow_list, mailer_otp_exp, exposed schemas, and
# the custom access-token hook.
#
# docs/environments.md documents them (#139). Documentation helps the person who
# reads it; it detects nothing. This job detects -- including someone flipping
# signup back on months from now.
#
# Scheduled rather than per-PR on purpose: these settings drift in the Supabase
# dashboard, not in a pull request, so a PR trigger would add a network
# dependency to every build while watching the wrong surface.
#
# CREDENTIAL NOTE
#   SUPABASE_ACCESS_TOKEN is an *account-wide* Management API PAT -- it is not
#   scoped to one project. Putting it in Actions widens its blast radius, so the
#   secret is deliberately NOT required: with it unset this job reports that and
#   exits green, and the check is run by hand instead:
#
#     SUPABASE_ACCESS_TOKEN=$(security find-generic-password -s supabase-mgmt -a lumi -w) \
#       node scripts/check-supabase-settings.mjs
#
#   Adding the secret is a deliberate decision, not a prerequisite for merging.
# ============================================================================
name: Supabase Settings

on:
  schedule:
    - cron: "23 7 * * *" # daily 07:23 UTC
  workflow_dispatch:

jobs:
  settings:
    name: Assert project settings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured, so this check cannot run."
            echo "That is a deliberate default -- see the credential note in this workflow."
            echo "Run it by hand instead:"
            echo "  node scripts/check-supabase-settings.mjs"
            exit 0
          fi
          node scripts/check-supabase-settings.mjs
