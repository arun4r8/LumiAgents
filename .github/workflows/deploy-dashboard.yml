name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (dashboard)
        working-directory: dashboard
        run: pnpm exec tsc --noEmit

  deploy:
    name: Build & Deploy
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        working-directory: dashboard
        run: pnpm opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}

      - name: Deploy to Cloudflare Workers
        working-directory: dashboard
        run: pnpm opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    name: Smoke Test (Dashboard)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for propagation
        run: sleep 15

      - name: Dashboard reachability
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          echo "→ GET $DASHBOARD_URL"
          status=$(curl -s --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" "$DASHBOARD_URL")
          echo "HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 0 ]; then
            echo "Dashboard returned $status — server error or unreachable"
            exit 1
          fi
          echo "✓ Dashboard reachability passed"

      - name: Runtime reachable from dashboard origin
        env:
          RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}
        run: |
          echo "→ GET $RUNTIME_URL/health (verifying runtime still up)"
          response=$(curl -sf --retry 3 --retry-delay 5 "$RUNTIME_URL/health")
          status=$(echo "$response" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "Runtime health check failed after dashboard deploy"
            exit 1
          fi
          echo "✓ Runtime health confirmed"
