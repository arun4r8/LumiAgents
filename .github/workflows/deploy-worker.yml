name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "orchestrations/**"
      - "integrations/**"
      - "agents/**"
      - "workers/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-worker.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (runtime + shared)
        run: pnpm typecheck

  migrate:
    name: Apply DB Migrations
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not "latest"): resolving "latest" hits the GitHub releases API at
          # job time and intermittently 504s, which fails the whole deploy. Bump
          # deliberately.
          version: 2.106.0

      - name: Link project
        run: supabase link --project-ref cuaknazkpmwvnkmwtamp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    name: Deploy Workers
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Runtime
        working-directory: runtime
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Angie
        working-directory: runtime
        run: pnpm exec wrangler deploy --config workers/angie/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Beady
        working-directory: runtime
        run: pnpm exec wrangler deploy --config workers/beady/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Patch
        working-directory: runtime
        run: pnpm exec wrangler deploy --config workers/patch/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Money
        working-directory: runtime
        run: pnpm exec wrangler deploy --config workers/money/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    name: Smoke Test (Runtime)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for propagation
        run: sleep 20

      - name: Health check
        env:
          RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}
        run: |
          echo "→ GET $RUNTIME_URL/health"
          response=$(curl -sf --retry 3 --retry-delay 5 "$RUNTIME_URL/health")
          echo "$response" | jq .
          status=$(echo "$response" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "Health check failed: status=$status"
            exit 1
          fi
          echo "✓ Health check passed"

      - name: Orchestration catalogue
        env:
          RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}
        run: |
          echo "→ GET $RUNTIME_URL/api/orchestrations"
          response=$(curl -sf --retry 3 --retry-delay 5 "$RUNTIME_URL/api/orchestrations")
          count=$(echo "$response" | jq 'length')
          echo "Catalogue contains $count orchestrations"
          if [ "$count" -lt 1 ]; then
            echo "Catalogue is empty — registry may not have loaded"
            exit 1
          fi
          echo "✓ Catalogue check passed"
          echo "$response" | jq '[.[] | .name]'

      - name: Vault webhook endpoint
        env:
          RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}
        run: |
          echo "→ POST $RUNTIME_URL/api/vault/webhook (bad sig — expect 401)"
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RUNTIME_URL/api/vault/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=invalidsignature" \
            -d '{"ref":"refs/heads/main","repository":{"owner":{"login":"LumitureLabs"},"name":"LumiKnowledge"},"commits":[]}')
          if [ "$status" != "401" ]; then
            echo "Expected 401, got $status — endpoint missing or auth not enforced"
            exit 1
          fi
          echo "✓ Vault webhook is live and HMAC-protected"

  e2e:
    name: E2E Tests
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e tests
        working-directory: runtime
        run: pnpm test:e2e
        env:
          E2E_RUNTIME_URL: ${{ secrets.NEXT_PUBLIC_RUNTIME_URL }}
          E2E_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_OPS_EMAIL: ${{ secrets.E2E_OPS_EMAIL }}
          E2E_OPS_PASSWORD: ${{ secrets.E2E_OPS_PASSWORD }}
