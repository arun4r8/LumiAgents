name = "lumiagents-runtime"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://jlljpgdqqxljvznjslmb.supabase.co"
JIRA_BASE_URL = "https://lumiture.atlassian.net"
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put`):
# SUPABASE_SERVICE_ROLE_KEY
# ANTHROPIC_API_KEY
# N8N_WEBHOOK_SECRET
# APOLLO_API_KEY
# JIRA_EMAIL
# JIRA_API_TOKEN
# SAM_GOV_API_KEY

[[workflows]]
name = "orchestration-runner"
binding = "RUNNER"
class_name = "OrchestrationRunner"

[ai]
binding = "AI"

[dev]
port = 8787
local_protocol = "http"
