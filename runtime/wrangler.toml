name = "lumiagents-runtime"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://jlljpgdqqxljvznjslmb.supabase.co"
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put`):
# SUPABASE_SERVICE_ROLE_KEY
# ANTHROPIC_API_KEY
# N8N_WEBHOOK_SECRET

[[workflows]]
name = "orchestration-runner"
binding = "RUNNER"
class_name = "OrchestrationRunner"

[dev]
port = 8787
local_protocol = "http"
