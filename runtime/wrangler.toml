name = "lumiagents-runtime"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://cuaknazkpmwvnkmwtamp.supabase.co"
JIRA_BASE_URL = "https://lumiture.atlassian.net"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://lumiagents-dashboard.lumiture.workers.dev"
VAULT_OWNER = "LumitureLabs"
VAULT_REPO  = "LumiKnowledge"
# BD site document library, where BD keeps the GovWin IQ exports that
# beady/govwin-import reads (#198). A different drive to BD_DRIVE_ID, which is the
# Lumiture Labs library. Read-only use: the importer never writes to it.
#
# The app's Sites.Selected grant must include the BD site for this to resolve --
# without it Graph returns 403 and the run fails loudly rather than importing
# nothing quietly. Unset → beady/govwin-import skips.
GOVWIN_DRIVE_ID = "b!kbYuUXk61EKMp1NaXf0WnNjiwP0elTFDgohE8mXziC-1RUzQQJdiRp5GmSPhiTqE"

# Content-calendar live sync (Microsoft Graph). Location of the planning workbook.
# Fill in once the Excel file's Graph drive + item IDs are known; the worksheet
# name is optional (unset → first sheet). Unset → cleo/content-sync stays disabled.
# CONTENT_CALENDAR_DRIVE_ID = ""
# CONTENT_CALENDAR_ITEM_ID  = ""
# CONTENT_CALENDAR_WORKSHEET = ""
# Per-project BD folders (#207). The Lumiture Labs default document library, which
# is the drive behind /sites/LumitureLabs/Shared Documents. Covered by the existing
# Sites.Selected write grant, so no new permission. A var rather than a secret: a
# drive id is not sensitive, and keeping it here means staging and production can
# differ and the value is reviewable in a PR.
BD_DRIVE_ID = "b!bd50wGHzTkyYU9BpkWz_g1-hQ_-X0qxEsh_XIKKEfTWQqQt1AtB_RrNcEUcYckHK"

# Secrets (set via `wrangler secret put`):
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# ANTHROPIC_API_KEY
# N8N_WEBHOOK_SECRET
# APOLLO_API_KEY
# JIRA_EMAIL
# JIRA_API_TOKEN
# SAM_GOV_API_KEY
# TEAMS_INCOMING_WEBHOOK_URL   ← Teams channel connector URL (notifications)
# TEAMS_BOT_APP_ID             ← Azure Bot registration App ID
# TEAMS_BOT_APP_SECRET         ← Azure Bot registration client secret
# GITHUB_API_TOKEN             ← GitHub PAT with repo scope (vault read/write)
# GITHUB_WEBHOOK_SECRET        ← Secret set in the GitHub push webhook config
# RESEND_API_KEY               ← Resend API key (email reports)
# RESEND_FROM                  ← optional sender, e.g. "Beady <reports@domain>"; needs a verified domain.
#                                Defaults to "Beady <onboarding@resend.dev>" (only delivers to the Resend account owner).
# TAVILY_API_KEY               ← Tavily web-search API key (LIVE — Beady/Cleo GovCon web search)
# ALERT_EMAIL                  ← optional comma-separated extra recipients for operational failure alerts
# SBIR_API_BASE                ← optional override for the DoD SBIR/STTR topics API base URL
# N8N_QUEUE_ENABLED            ← gate for the n8n call-queue drainer; disabled unless === "true"
# MSGRAPH_TENANT_ID            ← Azure AD tenant/directory GUID (content-calendar Graph sync)
# MSGRAPH_CLIENT_ID            ← Azure AD app registration (application) client ID
# MSGRAPH_CLIENT_SECRET        ← Azure AD app registration client secret (app-only, admin-consented Files.Read.All/Sites.Read.All)

[[workflows]]
name = "orchestration-workflow"
binding = "ORCHESTRATION_WORKFLOW"
class_name = "RunOrchestration"
script_name = "lumiagents-runtime"

# Per-agent Service Bindings: route chat requests to their own CF Workers.
[[services]]
binding = "ANGIE_WORKER"
service = "lumiagents-angie"

[[services]]
binding = "BEADY_WORKER"
service = "lumiagents-beady"

[[services]]
binding = "PATCH_WORKER"
service = "lumiagents-patch"

[[services]]
binding = "MONEY_WORKER"
service = "lumiagents-money"

[[services]]
binding = "CLEO_WORKER"
service = "lumiagents-cleo"

[[services]]
binding = "DEWEY_WORKER"
service = "lumiagents-dewey"

[triggers]
crons = ["*/5 * * * *"]  # meta-cron: checks orchestration.schedules every 5 min

[ai]
binding = "AI"

[dev]
port = 8787
local_protocol = "http"
# ---------------------------------------------------------------------------
# STAGING environment (issue #121)
#
# Deployed automatically on every merge to `main` by
# .github/workflows/deploy-staging.yml. Production config above is untouched —
# staging is purely additive. Nothing here is inherited from the top level:
# wrangler does NOT merge `vars`, `services`, `workflows`, `ai` or `triggers`
# into a named environment, so each is restated in full below.
#
# SUPABASE_URL is a PLACEHOLDER. The staging Supabase project is provisioned
# out-of-band (see docs/environments.md) and its project ref is deliberately not
# committed; CI overrides the value at deploy time with
#   wrangler deploy --env staging --var SUPABASE_URL:$STAGING_SUPABASE_URL
# ---------------------------------------------------------------------------
[env.staging]
name = "lumiagents-runtime-staging"

[env.staging.vars]
SUPABASE_URL = "https://STAGING-PROJECT-REF.supabase.co"  # overridden by CI (--var)
JIRA_BASE_URL = "https://lumiture.atlassian.net"
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "https://lumiagents-dashboard-staging.lumiture.workers.dev"
# NOTE: these point at the PRODUCTION vault repo. That is safe ONLY because staging
# deliberately has no GITHUB_API_TOKEN — the Knowledge Base editor PUTs file contents
# (runtime/src/routes/vault.ts), so a staging token here would commit to the real vault.
# Before adding that secret, fork to LumiKnowledge-staging and repoint VAULT_REPO.
VAULT_OWNER = "LumitureLabs"
VAULT_REPO  = "LumiKnowledge"

# Secrets: staging intentionally runs with ONLY three —
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_JWT_SECRET (both staging-specific,
#   never production's) and ANTHROPIC_API_KEY.
# Everything else (GITHUB_API_TOKEN, MSGRAPH_*, RESEND_*, JIRA_*, GH_APP_*, TEAMS_*,
# SAM_GOV/TAVILY/APOLLO keys) is deliberately UNSET because those integrations write to
# production systems — the real vault, the real content-calendar workbook, real email,
# real Jira tickets, real PRs — and there is no staging copy of those systems.
# Those features failing in staging is the safety mechanism, not a bug.
# See docs/environments.md → "Deliberately withheld from staging".
#   wrangler secret put <NAME> --env staging

[[env.staging.workflows]]
name = "orchestration-workflow-staging"
binding = "ORCHESTRATION_WORKFLOW"
class_name = "RunOrchestration"
script_name = "lumiagents-runtime-staging"

# Per-agent Service Bindings, staging twins.
[[env.staging.services]]
binding = "ANGIE_WORKER"
service = "lumiagents-angie-staging"

[[env.staging.services]]
binding = "BEADY_WORKER"
service = "lumiagents-beady-staging"

[[env.staging.services]]
binding = "PATCH_WORKER"
service = "lumiagents-patch-staging"

[[env.staging.services]]
binding = "MONEY_WORKER"
service = "lumiagents-money-staging"

[[env.staging.services]]
binding = "CLEO_WORKER"
service = "lumiagents-cleo-staging"

[[env.staging.services]]
binding = "DEWEY_WORKER"
service = "lumiagents-dewey-staging"

# Mirrors production so the scheduled-orchestration path is exercised before a
# promote. Set `crons = []` here if staging cron noise becomes a problem.
[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.ai]
binding = "AI"
