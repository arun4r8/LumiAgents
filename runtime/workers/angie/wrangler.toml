name = "lumiagents-angie"
main = "../../src/workers/angie.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://cuaknazkpmwvnkmwtamp.supabase.co"
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put --name lumiagents-angie`):
# ANTHROPIC_API_KEY

[[services]]
binding = "RUNTIME_WORKER"
service = "lumiagents-runtime"

[dev]
port = 8788

# ---------------------------------------------------------------------------
# STAGING environment (issue #121). Purely additive; production config above is
# unchanged. SUPABASE_URL is a placeholder overridden by CI with
#   wrangler deploy --env staging --var SUPABASE_URL:$STAGING_SUPABASE_URL
# Secrets: wrangler secret put ANTHROPIC_API_KEY --config workers/angie/wrangler.toml --env staging
# ---------------------------------------------------------------------------
[env.staging]
name = "lumiagents-angie-staging"

[env.staging.vars]
SUPABASE_URL = "https://STAGING-PROJECT-REF.supabase.co"  # overridden by CI (--var)
ENVIRONMENT = "staging"

[[env.staging.services]]
binding = "RUNTIME_WORKER"
service = "lumiagents-runtime-staging"
